# ⚠️ Summer of Making is ARCHIVED — the program has ended and this app is kept
# only as a read-only archive. The recurring jobs that used to run here all did
# background work against EXTERNAL services (hackatime, Slack, Airtable, GitHub,
# the Mole categorizer, theseus fulfillment). None of that should run for a dead
# program, so the whole production schedule is intentionally disabled.
#
# In particular, UserHackatimeDataRefreshJob looped over every ex-participant
# once an hour and called hackatime.hackclub.com/api/v1/users/<slack_id>/stats;
# for the many users who never had (or no longer have) a hackatime account that
# 404s, and nothing cleared the has_hackatime flag, so it re-queried them
# forever — ~276k 404s/day against hackatime. Leaving `production:` empty stops
# the recurring dispatcher from scheduling anything.
#
# If the archive ever genuinely needs one of these back, re-enable just that
# entry from the reference block below — do not restore the whole list.
production: {}

